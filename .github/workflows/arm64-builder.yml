name: Build Flutter Engine for arm64

on:
  workflow_dispatch:
    inputs:
      engine_commit:
        description: 'Flutter engine commit/tag to build'
        required: true
        type: string
      flutter_version:
        description: 'Flutter version label (e.g., 3.32.8)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install all dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ninja-build \
            pkg-config \
            libssl-dev \
            clang \
            cmake \
            curl \
            python3 \
            python3-pip \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Clone engine
        run: |
          git clone https://github.com/whoisxy/flutter-android.git engine
          cd engine
          git checkout ${{ inputs.engine_commit }}

      - name: Setup depot_tools and build
        run: |
          cd engine
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          export PATH="$(pwd)/depot_tools:$PATH"
          
          # Initialize gclient
          gclient config --spec 'solutions = [{"name": "src/flutter", "url": "https://github.com/whoisxy/flutter-android.git", "managed": True}]'
          gclient sync --revision src/flutter@${{ inputs.engine_commit }}
          
          #gclient config --spec 'solutions = [{"name": "src/flutter", "url": ".", "managed": False, "custom_deps": {}}]'
          #gclient sync
          
          # Generate and build
          gn gen out/host_release --args='is_debug=false target_cpu="arm64" is_official_build=true enable_lto=false'
          ninja -C out/host_release gen_snapshot

      - name: Package artifacts
        run: |
          cd engine
          mkdir -p artifacts/linux-arm64-release
          cp out/host_release/gen_snapshot artifacts/linux-arm64-release/
          chmod +x artifacts/linux-arm64-release/gen_snapshot
          tar -czf gen_snapshot-linux-arm64-${{ inputs.flutter_version }}.tar.gz -C artifacts linux-arm64-release/

      - name: Upload release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: engine-${{ inputs.flutter_version }}
          files: engine/gen_snapshot-linux-arm64-${{ inputs.flutter_version }}.tar.gz
          generate_release_notes: true
