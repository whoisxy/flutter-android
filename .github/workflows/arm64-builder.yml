name: Build Flutter Engine for arm64

on:
  workflow_dispatch:
    inputs:
      engine_commit:
        description: 'Flutter engine commit/tag to build'
        required: true
        type: string
      flutter_version:
        description: 'Flutter version label (e.g., 3.16.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build pkg-config libssl-dev clang cmake curl

      - name: Clone Flutter engine
        run: |
          git clone https://github.com/whoisxy/flutter-android engine
          cd engine
          git checkout ${{ inputs.engine_commit }}
    
      - name: Setup depot_tools and GN
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PATH:$(pwd)/depot_tools"
          # Ensure gn is available
          which gn || (cd depot_tools && python3 download_from_google_storage.py -b chromium-gn -s gn.sha1 && chmod +x gn)
          cd engine
          ../gn --unoptimized

      - name: Build gen_snapshot
        run: |
          export PATH="$PATH:$(pwd)/depot_tools"
          cd engine
          ../gn gen out/host_release --args='is_debug=false target_cpu="arm64"'
          ninja -C out/host_release gen_snapshot

      - name: Package artifacts
        run: |
          cd engine
          mkdir -p artifacts/linux-arm64-release
          cp out/host_release/gen_snapshot artifacts/linux-arm64-release/
          chmod +x artifacts/linux-arm64-release/gen_snapshot
          tar -czf gen_snapshot-linux-arm64-${{ inputs.flutter_version }}.tar.gz -C artifacts linux-arm64-release/

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: engine-${{ inputs.flutter_version }}
          files: engine/gen_snapshot-linux-arm64-${{ inputs.flutter_version }}.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
